<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" role="img" aria-label="Monochrome terminal showing an AI code snippet">
  <rect x="1" y="1" width="358" height="228" rx="14" fill="#000000" stroke="#333333" stroke-width="2"/>
  <circle cx="23" cy="22" r="4" fill="#666666"/>
  <circle cx="39" cy="22" r="4" fill="#999999"/>
  <circle cx="55" cy="22" r="4" fill="#cccccc"/>
  <text x="22" y="59" fill="#8c8c8c" font-family="monospace" font-size="12">$ build_agent --grounded</text>
  <text x="22" y="91" fill="#ffffff" font-family="monospace" font-size="13">retrieve(context)</text>
  <text x="22" y="119" fill="#b3b3b3" font-family="monospace" font-size="13">reason(evidence)</text>
  <text x="22" y="147" fill="#ffffff" font-family="monospace" font-size="13">verify(output)</text>
